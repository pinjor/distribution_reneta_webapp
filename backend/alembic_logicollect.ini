# Disposable LogiCollect schema only. Never run against swift_distro_hub.
# Commercial tables must already exist (alembic upgrade f3_export_draft).
#
#   DATABASE_URL=postgresql://.../logicollect_dev alembic -c alembic_logicollect.ini upgrade head

[alembic]
script_location = alembic_logicollect
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql://alembic:alembic@127.0.0.1:5432/alembic_disposable

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
