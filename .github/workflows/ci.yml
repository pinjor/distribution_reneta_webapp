name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-pytest:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-pytest-secret-not-production
      DATABASE_URL: sqlite:///:memory:
      SAMPLE_GIFT_DRAFT_WRITES: "yes"
      EXPORT_DRAFT_WRITES: "yes"
      REQUIRE_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest tests --junitxml=../test-results/backend-junit.xml -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: test-results/backend-junit.xml
          if-no-files-found: ignore

  frontend-unit-and-build:
    name: Frontend Vitest and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build

  playwright-isolated:
    name: Playwright Chromium isolated E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_pass
          POSTGRES_DB: reneta_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e_user -d reneta_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_RUNTIME: host
      E2E_DATABASE_URL: postgresql://e2e_user:e2e_pass@127.0.0.1:5432/reneta_e2e
      E2E_ISOLATED_PASSWORD: E2eIsolatedPass!9
      E2E_API_PORT: "18010"
      E2E_API_FLAGS_PORT: "18011"
      E2E_VITE_PORT: "15174"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Guard live database URL
        run: python3 e2e/lib/refuse_live.py "$E2E_DATABASE_URL"
      - name: Run isolated Playwright
        run: npm run test:e2e:isolated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            e2e/logs
          if-no-files-found: ignore
